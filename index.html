<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hip-Hop Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="music-player">
            <!-- Header -->
            <div class="player-header">
                <h1>🎵 Hip-Hop Music Player</h1>
                <p>Featuring: Lil Durk, Lil Baby & NBA YoungBoy</p>
            </div>

            <!-- Now Playing Section -->
            <div class="now-playing">
                <div class="album-art">
                    <img id="albumArt" src="https://via.placeholder.com/250?text=Music+Player" alt="Album Art">
                </div>
                <div class="song-info">
                    <h2 id="songTitle">Select a song</h2>
                    <p id="artistName">Artist</p>
                    <p id="albumName">Album</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar">
                    <input type="range" id="progressSlider" min="0" max="100" value="0">
                    <div class="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="shuffleBtn" class="control-btn" title="Shuffle">
                    <i class="fas fa-random"></i>
                </button>
                <button id="prevBtn" class="control-btn" title="Previous">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button id="playBtn" class="control-btn play-btn" title="Play">
                    <i class="fas fa-play"></i>
                </button>
                <button id="nextBtn" class="control-btn" title="Next">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button id="repeatBtn" class="control-btn" title="Repeat">
                    <i class="fas fa-repeat"></i>
                </button>
            </div>

            <!-- Volume Control -->
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
                <i class="fas fa-volume-up"></i>
            </div>

            <!-- Playlist -->
            <div class="playlist-section">
                <h3>Playlist</h3>
                <div class="playlist" id="playlist">
                    <!-- Songs will be populated here by JavaScript -->
                </div>
            </div>

            <!-- Audio Element -->
            <audio id="audioPlayer"></audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
